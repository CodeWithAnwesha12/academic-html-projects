<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body background="html_bgnd.jpeg">
<form>
    
  <h2>Online Job Application Form</h2><br>
  <fieldset>
  <legend><h3>Application Information</h3></legend>
  <label><b>1. Full Name</b></label><br>
  <input type="text" name="name" placeholder="Enter your full name" ><br>
  <label><b>2. Email</b></label><br>
  <input type="email" id="email" name="email" placeholder="Enter your mail"><br>
  <label><b>3. Phone Number</b></label><br>
  <input type="tel" id="tel" number="tel" placeholder="Enter your mobile number"><br>
  <label><b>4. Date of Birth</b></label><br>
  <input type="date" id="dob" placeholder="dd-mm-yyyy"><br>
  <label><b>5. Gender</b></label><br>
  <input type="radio" id="gender" name="gender" value="male">Male<br>
  <input type="radio" id="gender" name="gender" value="female">Female<br>
  <input type="radio" id="gender" name="gender" value="others">Others<br>
  <label><b>6. Position Applied For</b></label><br>
  <select id="Position">
    <option>---Select Position---</option>
    <option>Web Developer</option>
    <option>Software Developer</option>
    <option>Data Analyst</option>
    <option>UI/UX Designer</option>

  </select><br>
  <label><b>7.Experience (in years)</b></label><br>
  <input type="text" name="text" placeholder="Enter yours of experience"><br>
  

</fieldset>
  </form>
  
</body>
</html>
